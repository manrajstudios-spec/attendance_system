<!DOCTYPE html>
<html>
    <head>
        <title>
            Login Page
        </title>
    </head>

    <body>
        <h1>Admin Login Page</h1>
        
        <div id="error_div">
            <span id="error_span">Wrong Password</span>
        </div>

        <form action="admin_login_page.html" id="login_form">
            <input type="password" id="password_feild" required placeholder="Enter Password">
            <button type="submit" class="btn">Enter</button>
        </form>

        <script>
            const login_form = document.getElementById("login_form");

            const error_div = document.getElementById("error_div");
            
            login_form.addEventListener("submit", async(event)=>{
                event.preventDefault();

                const password_field = document.getElementById("password_feild");

                const response = await fetch("http://127.0.0.1:8004/verify_password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({admin_password:password_field.value})});

                result = await response.json();

                if (result["success"]){
                    console.log("Verified");
                    window.location.href = "admin_options.html";
                }
                else{
                    error_div.classList.add("show_error");

                    await new Promise(resolve => setTimeout(resolve,2000));

                    error_div.classList.remove("show_error");
                }
            });
        </script>
            
        <style>
            h1{
                text-align: center;
                font-family:Georgia, 'Times New Roman', serif;
                font-size: 30px;
                color: transparent;

                background: linear-gradient(120deg, rgb(3, 242, 255), rgb(25, 0, 255));
                background-clip: text;
                -webkit-background-clip: text;
                cursor:default;
            }   

            #error_div{
                text-align: center;
                opacity: 0;
                transition: all 0.3s ease-in-out;
                transform: translateY(-100px);
            }

            #error_div.show_error{
                opacity: 1;
                transform: translateY(0);
            }

            #error_span{
                border: solid red;
                border-radius: 15px;
                padding: 10px 10px;
                background: linear-gradient(180deg , rgb(126, 46, 0), rgb(225, 0, 0));
            }
            
            #login_form{
                min-height: 50vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 15px;
            }

            #password_feild{
                font-family: 'Times New Roman', Times, serif;
                font-weight: 500;
                border-radius: 20px;
                padding: 10px 10px;
                background: linear-gradient(70deg, rgba(0, 12, 237, 0.488),rgba(0, 242, 255, 0.465));
                transition: all 0.3s ease-in-out;
            }

            #password_feild:hover{
                transform: translateY(5px) scale(1.1);
                background: linear-gradient(70deg, rgba(0, 192, 235, 0.478),rgba(0, 59, 251, 0.371));
                transition: all 0.3s ease-in-out;
            }

            .btn{
                border: none;
                border-radius: 15px;
                padding: 15px 15px;
                background: linear-gradient(70deg, rgb(0, 12, 237),rgb(0, 242, 255));
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
                font-weight: 800;
                font-size: 15px;
                cursor: pointer;
                transition: all 0.3s ease-in-out;
            }

            .btn:hover{
                transform: translateY(5px) scale(1.1);
                background: linear-gradient(70deg, rgb(0, 192, 235),rgb(0, 59, 251));
                transition: all 0.3s ease-in-out;
            }
        </style>
    </body>
</html>
