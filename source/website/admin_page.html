<!DOCTYPE html>
<html>
    <head>
        <title>
            Admin Page
        </title>
    </head>

    <body>
        <h1 id="heading">Welcome Admin</h1>

        <form action="admin_page.html" id="admin_options">
            <button type="submit" value="new_batch" class="btn">Add New Batch</button>
            <br>
            <br>
            <button type="submit" value="remove_batch" class="btn">Remove A Batch</button>
            <br><br>
            <button type="submit" value="new_student" class="btn">Add New Student</button>
            <br><br>
            <button type="submit" value="remove_student" class="btn">Remove A Student</button>

        </form>
        
        <style>
            #heading{
                text-align: center;
                margin-top: 18px;

                font-family: Arial, sans-serif;
                font-size: 32px;
                font-weight: 700;

                background: linear-gradient(120deg, #25caeb, #4653e5);
                background-clip:content-box;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;

                letter-spacing: -0.7px;
            }

            #admin_options {
                min-height: 70vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 15px;
            }

            .btn{
                color: white;
                border: none;
                border-radius: 20px;
                padding: 20px 20px;
                font-family: Arial;
                font-weight: 800;
                font-size: 15px;
                background-color: rgba(0, 17, 255, 0.828);
                cursor:pointer;
                transition: all 0.2s ease-in-out; 
                box-shadow: 0 4px 20px rgba(37, 146, 235, 0.593);
            }

            .btn:hover{
                transform: translateY(2px);
                transform: scale(1.1);
                background-color: rgba(30, 0, 255, 0.51);
                box-shadow: 0 4px 10px rgba(235, 44, 37, 0.25);
            }

        </style>

        <script>
            async function auth_check(){
                const auth = await fetch("http://127.0.0.1:8004/check_auth");
    
                const result_auth = await auth.json();
                
                console.log(result_auth["auth"]);

                if (!result_auth["auth"]){
                    window.location.href = "admin_login_page.html";
                }
            }

            auth_check();

            const form = document.getElementById("admin_options");

            form.addEventListener("submit",(event) => {
                event.preventDefault();

                const button = event.submitter

                if (button.value === "new_batch"){
                    window.location.href = "add_new_batch.html";                    
                }
                else if(button.value === "remove_batch"){
                    window.location.href = "remove_batch.html";                    
                }
                else if(button.value === "new_student"){
                    window.location.href = "add_new_student.html";                    
                }
                else{

                }
            });
        </script>
    </body>
</html>
