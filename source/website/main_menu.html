<!DOCTYPE html>
<html>
    <head>
        <title>Attendace System</title>
    </head>

    <body>
        <h1 id="heading">Attendace System</h1>
 
        <form action="main_menu.html" id="main_form">
            <button type="submit" value="admin" class="btn">Admin</button>
            <br>
            <br>
            <button type="submit" value="student" class="btn">Student</button>
        </form>

        <style>
            body { 
                margin: 0;
                min-height: 100vh;
    
                background: linear-gradient(
                    135deg,
                    #f8faff,
                    #eef3ff
                );
    
                font-family: Arial, sans-serif;
            }
            
            #heading{
                text-align: center;
                margin-top: 18px;

                font-family: Arial, sans-serif;
                font-size: 32px;
                font-weight: 700;

                background: linear-gradient(90deg, #2563eb, #4f46e5);
                background-clip:border-box;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;

                letter-spacing: -0.7px;
            }

            #main_form{
                min-height: 70vh;                
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 15px;
            }
            
            .btn {
                padding: 12px 24px;
                border: none;
                border-radius: 10px; 
                background: #2563eb;
                color: white;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease-in-out;
                box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
            }

            .btn:hover {
                background: #1d4ed8;
                transform: translateY(-2px);
                box-shadow: 0 6px 14px rgba(37, 99, 235, 0.3);
            }
        </style>

        <script>
            async function reset_auth(){
                const res = await fetch("http://127.0.0.1:8004/main_menu");
            }

            reset_auth();
            
            const form = document.getElementById("main_form");

            form.addEventListener("submit",(event) => {
                event.preventDefault();
                
                const pressed_button = event.submitter;
            
                console.log(pressed_button.value);
            
                if (pressed_button.value === "admin"){
                    window.location.href = "admin_login_page.html"
                }
                else{
                    window.location.href = "student_page.html"
                }
            });
        </script>
    </body>
</html>
