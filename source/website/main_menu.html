<!DOCTYPE html>
<html>
    <head>
        <title>Attendance System</title>
    </head>

    <body>
        <h1>Attendance System</h1>

        <form action="main_menu.html" id="options_form">
            <button type="submit" value="admin" class="btn">Admin</button>
            <button type="submit" value="student" class="btn">Student</button>
        </form>

        <script>
            async function reset_auth() {
                const response = await fetch("http://127.0.0.1:8004/reset_auth")
            }

            reset_auth();

            const options_form = document.getElementById("options_form");

            options_form.addEventListener("submit",(event) => {
                event.preventDefault();

                if (event.submitter.value === "admin"){
                    window.location.href = "admin_login_page.html"
                }
                else{
                    window.location.href = "student_page.html"
                }
            });
            
        </script>

        <style>
            h1{
                text-align: center;
                font-family:Georgia, 'Times New Roman', serif;
                font-size: 30px;
                color: transparent;

                background: linear-gradient(60deg, rgb(0, 43, 137), rgb(0, 221, 255));
                background-clip: text;
                -webkit-background-clip: text;
                cursor:default;
            }

            #options_form{
                min-height: 50vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 15px;
            }

            .btn{
                border: none;
                border-radius: 15px;
                padding: 15px 15px;
                background: linear-gradient(70deg, rgb(44, 173, 196),rgb(12, 59, 146));
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
                font-weight: 800;
                font-size: 15px;
                cursor: pointer;
                transition: all 0.3s ease-in-out;
            }

            .btn:hover{
                transform: translateY(5px) scale(1.1);
                background: linear-gradient(70deg, rgb(44, 64, 196),rgb(12, 146, 139));
                transition: all 0.3s ease-in-out;
            }
        </style>
    </body>
</html>
