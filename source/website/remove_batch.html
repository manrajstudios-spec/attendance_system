<!DOCTYPE html>
<html>
    <head>
        <title>Remove A Batch</title>
    </head>

    <body>
        <h1>Remove Batch</h1>

        <div id="success_div">
        </div>

        <form action="remove_a_batch.html" id="batches_form">

        </form>
        
        <script>
            const batches_form = document.getElementById("batches_form");
            const success_div = document.getElementById("success_div");

            async function check_auth(){
                const response = await fetch("http://127.0.0.1:8004/check_auth");

                const result = await response.json();
                
                if(!result["auth_status"]){
                    window.location.href = "admin_login_page.html";
                }
            }

            check_auth();
            
            async function show_batches() {
                batches_form.textContent = "";

                const response = await fetch("http://127.0.0.1:8004/list_batches");

                const result = await response.json();

                const batches = result["all_batches"];

                for(let i =0; i<batches.length;i++){
                    const cur_batch = batches[i];

                    const element = document.createElement("button");

                    element.classList.add("btn");
                    element.type = "submit";
                    element.value = cur_batch;
                    element.textContent = cur_batch;
                    batches_form.appendChild(element);
                }
            }

            show_batches();

            batches_form.addEventListener("submit",async (event) => {
                success_div.classList.remove("show_sccuess");

                event.preventDefault();
                
                const to_remove = event.submitter.value;

                const response = await fetch("http://127.0.0.1:8004/remove_batch",{method:"POST",headers:{"Content-type":"application/json"},body:JSON.stringify({batch_name:to_remove})});

                const result = await response.json();

                if (result["success"]){
                    show_batches();

                    const new_span = document.createElement("span");

                    new_span.textContent = "Batch Remove Successfully";

                    new_span.classList.add("success_span");

                    success_div.appendChild(new_span);

                    success_div.classList.add("show_success");

                    await new Promise(resolve => setTimeout(resolve,2000));

                    success_div.classList.remove("show_success");
                    success_div.textContent = "";
                }
            });

        </script>

        <style>
            h1{
                text-align: center;
                font-family:Georgia, 'Times New Roman', serif;
                font-size: 30px;
                color: transparent;

                background: linear-gradient(120deg, rgb(0, 140, 255), rgb(212, 0, 255));
                background-clip: text;
                -webkit-background-clip: text;
                cursor:default;
            }  

            #success_div{
                text-align: center;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                opacity: 0;
                transition: all 0.3s ease-in-out;
                transform: translateY(-100px);
            }

            #success_div.show_success{
                opacity: 1;
                transform: translateY(0);
            }

            .success_span{
                border: solid rgb(89, 255, 0);
                border-radius: 15px;
                padding: 10px 10px;
                background: linear-gradient(180deg , rgb(128, 175, 0),rgb(5, 255, 130));
            }

            #batches_form{
                min-height: 50vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 15px;
            }

            .btn{
                border: none;
                border-radius: 15px;
                padding: 15px 15px;
                background: linear-gradient(70deg, rgb(0, 221, 255),rgb(77, 0, 244));
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
                font-weight: 800;
                font-size: 15px;
                cursor: pointer;
                transition: all 0.3s ease-in-out;
            }

            .btn:hover{
                transform: translateY(5px) scale(1.1);
                background: linear-gradient(70deg, rgb(77, 0, 244),rgb(0, 221, 255));
                transition: all 0.3s ease-in-out;
            }

        </style>
    </body>
</html>
