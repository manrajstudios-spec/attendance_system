<!DOCTYPE html>
<html>
    <head>
        <title>Remove Student</title>
    </head>

    <body>
        <h1>Remove Student</h1>

        <div id="message_div">

        </div>

        <form action="remove_batch.html" id="student_data_form">
            <select name="batches" id="course_selector" required class="input_field">

            </select>

            <select name="students" id="students_list" class="input_field" required>

            </select>

            <button type="submit" class="btn">Remove</button>
        </form>

        <script>
            async function check_auth(){
                const response = await fetch("http://127.0.0.1:8004/check_auth");

                const result = await response.json();
                
                if(!result["auth_status"]){
                    window.location.href = "admin_login_page.html";
                }
            }

            check_auth();

            const batch_selector = document.getElementById("course_selector");
            const message_div = document.getElementById("message_div");

            async function add_batches() {
                const response = await fetch("http://127.0.0.1:8004/list_batches");
                const result = await response.json();
                const batches = result["all_batches"];

                for(let i =0;i<batches.length;i++){
                    cur_batch = batches[i];

                    const new_option = document.createElement("option");

                    new_option.value = cur_batch;
                    new_option.textContent = cur_batch;

                    batch_selector.appendChild(new_option);
                }

                if (batches.length <= 0){
                    const new_option = document.createElement("option");
                    new_option.value = "none";
                    new_option.textContent = "No Options Available";
                    new_option.classList.add("select_element")

                    batch_selector.appendChild(new_option);
                }
            }

            const students_drop_down = document.getElementById("students_list");

            async function add_students() {
                if(batch_selector.value === "No Options Available"){
                    const new_option = document.createElement("option");
                    new_option.value = "none";
                    new_option.textContent = "No Options Available";
                    new_option.classList.add("select_element")
                    
                    students_drop_down.appendChild(new_option);
                    return;
                }

                console.log(batch_selector.value);
                
                const response = await fetch("http://127.0.0.1:8004/list_students",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({selected_batch:batch_selector.value})});    
                const result = await response.json();

                const students = result["students"];

                for(let i=0;i<students.length;i++){
                    const cur_student = students[i];

                    const new_option = document.createElement("option");

                    new_option.value = cur_student[1];
                    new_option.textContent = cur_student[0];

                    students_drop_down.appendChild(new_option);
                }

                if(students.length <= 0){
                    const new_option = document.createElement("option");
                    new_option.value = "none";
                    new_option.textContent = "No Options Available";
                    new_option.classList.add("select_element")
                    
                    students_drop_down.appendChild(new_option);
                    return;
                }
            }

            async function initialize() {
                await add_batches();
                await add_students();
            }

            initialize();

            const student_data_form = document.getElementById("student_data_form");

            student_data_form.addEventListener("submit",async (event) => {
                event.preventDefault();
                
                const batch_selected = batch_selector.value;

                if (batch_selected.value === "No Options Available"){
                    const new_msg = document.createElement("span");

                    new_msg.classList.add("error_span");
                    new_msg.textContent = "Please Select A Option";
                    message_div.appendChild(new_msg);
                    message_div.classList.add("show_div");

                    await new Promise(resolve => setTimeout(resolve,2000));

                    message_div.classList.remove("show_div");
                    message_div.removeChild(new_msg);

                    return;
                }

                const response = await fetch("http://127.0.0.1:8004/remove_student",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({student_id:students_drop_down.value,selected_batch:batch_selected})});

                const result = await response.json();

                batch_selector.textContent = "";
                students_drop_down.textContent = "";

                if (typeof result["success"] === "string"){
                    const new_msg = document.createElement("span");

                    new_msg.classList.add("error_span");
                    new_msg.textContent = result["success"];
                    message_div.appendChild(new_msg);
                    message_div.classList.add("show_div");

                    await new Promise(resolve => setTimeout(resolve,2000));

                    message_div.classList.remove("show_div");
                    message_div.removeChild(new_msg);
                }
                else{
                    const new_msg = document.createElement("span");

                    new_msg.classList.add("success_span");
                    new_msg.textContent = "Student Deleted Successfully";
                    message_div.appendChild(new_msg);
                    message_div.classList.add("show_div");
                    
                    await new Promise(resolve => setTimeout(resolve,2000));

                    message_div.classList.remove("show_div");
                    message_div.removeChild(new_msg);
                }

                initialize();

            });

        </script>

        <style>
            h1{
                text-align: center;
                font-family:Georgia, 'Times New Roman', serif;
                font-size: 30px;
                color: transparent;

                background: linear-gradient(120deg, rgb(242, 255, 0), rgb(90, 215, 0));
                background-clip: text;
                -webkit-background-clip: text;
                cursor:default;
            }   

            #message_div{
                text-align: center;
                opacity: 0;
                transition: all 0.3s ease-in-out;
                transform: translateY(-100px);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            #message_div.show_div{
                opacity: 1;
                transform: translateY(0);
            }

            .error_span{
                border: solid red;
                border-radius: 15px;
                padding: 10px 10px;
                background: linear-gradient(180deg , rgb(126, 46, 0), rgb(225, 0, 0));
            }

            .success_span{
                border: solid rgb(89, 255, 0);
                border-radius: 15px;
                padding: 10px 10px;
                background: linear-gradient(180deg , rgb(128, 175, 0),rgb(5, 255, 130));
            }

            #student_data_form{
                min-height: 50vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 15px;
            }

            .input_field{
                font-family: 'Times New Roman', Times, serif;
                font-weight: 500;
                border-radius: 20px;
                padding: 10px 10px;
                background: linear-gradient(70deg, rgba(204, 255, 0, 0.488),rgba(0, 255, 115, 0.465));
                transition: all 0.3s ease-in-out;
                cursor: pointer;
            }

            .input_field:hover{
                transform: translateY(5px) scale(1.1);
                background: linear-gradient(70deg, rgba(0, 255, 115, 0.465),rgba(204, 255, 0, 0.488));
                transition: all 0.3s ease-in-out;
            }

            .btn{
                border: none;
                border-radius: 15px;
                padding: 15px 15px;
                background: linear-gradient(70deg, rgb(132, 247, 0),rgb(4, 235, 139));
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
                font-weight: 800;
                font-size: 15px;
                cursor: pointer;
                transition: all 0.3s ease-in-out;
            }

            .btn:hover{
                transform: translateY(5px) scale(1.1);
                background: linear-gradient(70deg, rgb(4, 235, 139),rgb(132, 247, 0));
                transition: all 0.3s ease-in-out;
            }
        </style>
    </body>
</html>
