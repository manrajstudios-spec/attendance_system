<!DOCTYPE html>
<html>
    <head>
        <title>Student Page</title>
    </head>

    <body>
        <h1>Attendance Page</h1>
        
        <div id="message_div">

        </div>

        <form action="student_page.html" id="student_form">
            <select name="course" id="course_selector" class="input_field"></select>

            <video id="camera" autoplay></video>
            <canvas id="canvas"></canvas>

            <button type="button" class="btn" id="cap_reset_btn">Capture</button>
            <button type="submit" class="btn">Attend</button>
        </form>

        <script>
            const batch_selector = document.getElementById("course_selector");
            const message_div = document.getElementById("message_div");

            async function add_batches() {
                const response = await fetch("http://127.0.0.1:8004/list_batches");
                const result = await response.json();
                const batches = result["all_batches"];

                for(let i =0;i<batches.length;i++){
                    cur_batch = batches[i];

                    const new_option = document.createElement("option");

                    new_option.value = cur_batch;
                    new_option.textContent = cur_batch;

                    batch_selector.appendChild(new_option);
                }

                if (batches.length <= 0){
                    const new_option = document.createElement("option");
                    new_option.value = "none";
                    new_option.textContent = "No Options Available";
                    new_option.classList.add("select_element")

                    batch_selector.appendChild(new_option);
                }
            }

            add_batches();

            const video = document.getElementById("camera");
            const canvas = document.getElementById("canvas");

            navigator.mediaDevices.getUserMedia({video:true}).then(stream=>{video.srcObject=stream;});

            const cap_reset_button = document.getElementById("cap_reset_btn");

            let base64_image = null;

            cap_reset_button.addEventListener("click", (event) => {

                if (cap_reset_button.textContent === "Capture"){
                    video.pause();
                    cap_reset_button.textContent = "Reset";

                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
    
                    const ctx = canvas.getContext("2d");
    
                    ctx.drawImage(video,0,0);
    
                    canvas.toBlob(blob=>{
                        const reader = new FileReader();
    
                        reader.readAsDataURL(blob);
    
                        reader.onloadend = function() {
                            base64_image = reader.result;
                        }
                    });
                }
                else{
                    video.play();

                    cap_reset_button.textContent = "Capture";
                    base64_image = null;
                }
            });

            const student_form = document.getElementById("student_form");

            student_form.addEventListener("submit", async (event) => {
                event.preventDefault();

                if (base64_image === null){
                    const message_span = document.createElement("span");

                    message_span.classList.add("error_span");
                    message_span.textContent = "Please Click Picture First";
                    
                    message_div.appendChild(message_span);
                    message_div.classList.add("show_div");

                    await new Promise(resolve => setTimeout(resolve,2000));

                    message_div.classList.remove("show_div");
                    message_div.removeChild(message_span)
                    message_div.textContent = "";

                    return;
                }

                if(batch_selector.value === "none"){
                    const message_span = document.createElement("span");

                    message_span.classList.add("error_span");
                    message_span.textContent = "No Course Selected";
                    
                    message_div.appendChild(message_span);
                    message_div.classList.add("show_div");

                    await new Promise(resolve => setTimeout(resolve,1000));

                    message_div.classList.remove("show_div");
                    message_div.removeChild(message_span)
                    message_div.textContent = "";

                    return;
                }

                const batch_selected = batch_selector.value;

                const response = await fetch("http://127.0.0.1:8004/attend_class",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({selected_batch:batch_selected,student_picture:base64_image})});

                const result = await response.json();

                if (typeof result["result"] === "string"){
                    const message_span = document.createElement("span");

                    message_span.classList.add("error_span");
                    message_span.textContent = result["result"];
                    
                    message_div.appendChild(message_span);
                    message_div.classList.add("show_div");

                    await new Promise(resolve => setTimeout(resolve,1000));

                    message_div.classList.remove("show_div");
                    message_div.removeChild(message_span)
                    message_div.textContent = "";
                }
                else{
                    const message_span = document.createElement("span");

                    message_span.classList.add("success_span");
                    message_span.textContent = "Attendace Conducted Successfully";
                    
                    message_div.appendChild(message_span);
                    message_div.classList.add("show_div");

                    await new Promise(resolve => setTimeout(resolve,1000));

                    message_div.classList.remove("show_div");
                    message_div.removeChild(message_span)
                    message_div.textContent = "";
                }
            });
            

        </script>

        <style>
            h1{
                text-align: center;
                font-family:Georgia, 'Times New Roman', serif;
                font-size: 30px;
                color: transparent;

                background: linear-gradient(120deg, rgb(0, 26, 255),rgb(0, 247, 165));
                background-clip: text;
                -webkit-background-clip: text;
                cursor:default;
            }   

            #message_div{
                text-align: center;
                opacity: 0;
                transition: all 0.3s ease-in-out;
                transform: translateY(-100px);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            #message_div.show_div{
                opacity: 1;
                transform: translateY(0);
            }

            .error_span{
                border: solid red;
                border-radius: 15px;
                padding: 10px 10px;
                background: linear-gradient(180deg , rgb(126, 46, 0), rgb(225, 0, 0));
            }

            .success_span{
                border: solid rgb(89, 255, 0);
                border-radius: 15px;
                padding: 10px 10px;
                background: linear-gradient(180deg , rgb(128, 175, 0),rgb(5, 255, 130));
            }

            #student_form{
                min-height: 50vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 15px;
            }

            #canvas{
                display: none;
            }

            .input_field{
                font-family: 'Times New Roman', Times, serif;
                font-weight: 500;
                border-radius: 20px;
                padding: 10px 10px;
                background: linear-gradient(70deg, rgb(0, 247, 165),rgb(0, 26, 255));
                transition: all 0.3s ease-in-out;
                cursor: pointer;
            }

            .input_field:hover{
                transform: translateY(5px) scale(1.1);
                background: linear-gradient(70deg, rgb(0, 26, 255),rgb(0, 247, 165));
                transition: all 0.3s ease-in-out;
            }

            .btn{
                border: none;
                border-radius: 15px;
                padding: 15px 15px;
                background: linear-gradient(70deg, rgb(0, 247, 165),rgb(0, 26, 255));
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
                font-weight: 800;
                font-size: 15px;
                cursor: pointer;
                transition: all 0.3s ease-in-out;
            }

            .btn:hover{
                transform: translateY(5px) scale(1.1);
                background: linear-gradient(70deg, rgb(0, 26, 255),rgb(0, 247, 165));
                transition: all 0.3s ease-in-out;
            }

        </style>
    </body>
</html>
